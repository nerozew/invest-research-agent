# P04-09/10：GitHub Actions 构建镜像并推送 GHCR（Phase 4）
# 由 GitHub-hosted runner 构建（出网快）。
# 说明：除推送 GHCR 外，额外把镜像导出为 tar 上传 Actions artifact，
#       供 Ubuntu 服务器在无法直连 GHCR 时下载后 `docker load` 使用。

name: docker-image

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/**'
    tags:
      - 'v*'

# 权限最小化：只读仓库内容 + 可写 GHCR 包
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=phase4
            type=sha,format=long

      # 只构建 linux/amd64，本阶段不引入多架构复杂度。
      # 使用 gha 缓存跨构建复用；仅当构建成功后 build-push-action 才推送到 GHCR。
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 说明：不传入任何 .env / 真实密钥作为 build-arg。
          # 运行时敏感配置由部署方在服务器 .env 提供，不进镜像构建日志。

      # ---- 补充：导出镜像 tar 并上传 artifact（供无法直连 GHCR 的服务器 docker load）----
      - name: Export image tarball
        shell: bash
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:phase4"
          docker pull "$IMAGE"
          mkdir -p /tmp/image-out
          docker save "$IMAGE" | gzip > /tmp/image-out/invest-research-phase4.tar.gz
          ls -lh /tmp/image-out/invest-research-phase4.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: invest-research-phase4-image
          path: /tmp/image-out/invest-research-phase4.tar.gz
          retention-days: 7