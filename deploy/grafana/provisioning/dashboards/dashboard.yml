# P06-06：Grafana 自动 provision dashboards
# 自动加载 deploy/grafana/provisioning/dashboards/*.json（已有 research.json）。
apiVersion: 1

providers:
  - name: invest-research
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards