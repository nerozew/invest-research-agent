# OpenTelemetry Collector 最小本地配置（P06-05）
#
# 用途：在本地聚合 API / Worker / Flow / Tool 的 OTLP trace，供链路查看
# （后续 P06-06 会把它加入 Docker Compose；本文件可独立运行）。
#
# 独立运行（本机已装 Docker 时）：
#   docker run --rm -p 4318:4318 \
#     -v "$(pwd)/deploy/otel-collector.yaml:/etc/otelcol/config.yaml" \
#     otel/opentelemetry-collector:latest
# 然后设置应用环境变量 OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 启动 API/Worker。
#
# 说明：
# - 只接收 OTLP HTTP（4318）；不暴露公网，仅本机/内网使用；
# - debug exporter 把 trace 打印到 collector 控制台（本地观察链路）；正式环境可换成
#   jaeger/zipkin/tempo 等后端（属 P06-06 本地部署范围，不在本任务内执行）。

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
