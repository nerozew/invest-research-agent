# P06-06 + P06-06C：Prometheus 本地采集配置
# P06-06C：新增 Worker 独立 metrics target（worker:9101，多进程 Registry 聚合）。
# API（api:8000）保持单进程 Registry；两个 target 的同名指标由 Prometheus 自动合并求和。
# 本地开发用途，不暴露公网。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: invest-research-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    # 低基数 label：只保留 instance 与 job，避免把公司名/job_id 带进指标。
    # metric_relabel 白名单：保留业务指标 + process_*；Histogram 需同时保留
    # _bucket/_sum/_count 后缀（否则 histogram_quantile 无法计算）。
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "(research_jobs_total|workflow_steps_total|workflow_step_duration_seconds|workflow_step_duration_seconds_bucket|workflow_step_duration_seconds_sum|workflow_step_duration_seconds_count|tool_calls_total|tool_retries_total|quality_gate_failures_total|stale_running_steps|process_.*)"
        action: keep

  - job_name: invest-research-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
    # Worker 侧重业务指标：任务步骤/工具/质量门禁大多发生在 Worker 进程。
    # 白名单与 API 保持一致（不含 job_id/公司名高基数 label）。
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "(research_jobs_total|workflow_steps_total|workflow_step_duration_seconds|workflow_step_duration_seconds_bucket|workflow_step_duration_seconds_sum|workflow_step_duration_seconds_count|tool_calls_total|tool_retries_total|quality_gate_failures_total|stale_running_steps|process_.*)"
        action: keep