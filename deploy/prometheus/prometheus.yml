# P06-06：Prometheus 本地采集配置
# 只采集 API 的 /metrics（P05-06 已暴露，无 job_id 高基数 label）。
# 本地开发用途，不暴露公网。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: invest-research-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    # 低基数 label：只保留 instance 与 job，避免把公司名/job_id 带进指标。
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "(research_jobs_total|workflow_steps_total|tool_calls_total|tool_retries_total|quality_gate_failures_total|stale_running_steps|process_.*)"
        action: keep